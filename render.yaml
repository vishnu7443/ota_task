databases:
  - name: ota-postgres
    databaseName: ota_prod
    user: ota_admin
    plan: free
    postgresMajorVersion: "16"

services:
  - type: web
    name: ota-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ota-postgres
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: ENABLE_DEV_SEED
        value: "false"
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_EXPIRE_MINUTES
        value: "480"
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: BOOTSTRAP_ADMIN_USERNAME
        value: factory_admin
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
