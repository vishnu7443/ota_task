services:
  postgres:
    image: postgres:16-alpine
    container_name: ota-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ota_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ota_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-ota_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ota_pgdata:/var/lib/postgresql/data
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ota_admin} -d ${POSTGRES_DB:-ota_dev}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ota-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ota_admin}:${POSTGRES_PASSWORD:-ota_dev_password}@postgres:5432/${POSTGRES_DB:-ota_dev}
      TEST_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ota_admin}:${POSTGRES_PASSWORD:-ota_dev_password}@postgres:5432/${POSTGRES_TEST_DB:-ota_test}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev_only_secret_key_change_in_production_32chars}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-480}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:5173","http://127.0.0.1:5173"]}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ENABLE_DEV_SEED: ${ENABLE_DEV_SEED:-true}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ota-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api/v1}
    ports:
      - "5173:5173"

volumes:
  ota_pgdata:
